# Kitchey — self-hosted
# Kom i gang: kopiér .env.example til .env, udfyld den, og kør: docker compose up -d
# Opdatér:    docker compose pull && docker compose up -d
# Backup:     tag backup før opdatering, se "Backup og gendannelse" i selfhost/README.md

services:
  db:
    image: postgres:16-alpine
    container_name: kitchey-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kitchey
      POSTGRES_USER: kitcheyuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD mangler i .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitcheyuser -d kitchey"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # latest som default. Pin evt. til major.minor (fx :1.2) for mere forudsigelige opdateringer.
    image: ghcr.io/zeppdk/kitchey:latest
    container_name: kitchey-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://kitcheyuser:${DB_PASSWORD}@db:5432/kitchey
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET mangler i .env}
      APP_URL: ${APP_URL:?APP_URL mangler i .env}
      SELF_HOSTED: "true"
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-false}
      UPLOADS_DIR: /uploads
      TZ: ${TZ:-Europe/Copenhagen}
    volumes:
      - uploads:/uploads
    ports:
      - "${PORT:-3035}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  uploads:
